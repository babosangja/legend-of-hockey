/* Layout: an arcade table seen from above. The LED score housing rides along the table's edge, the table is the hero, and menus lie on it like a laminated rules card. */
:root{
  --room:#D8DEE3;
  --ink:#151E28;
  --muted:#56626E;
  --card:#F7F9FA;
  --well:#E9EEF1;
  --line:#C2CBD3;
  --scrim:rgba(216,222,227,.58);
  --gold:#A87604;
  --p-ui:#D13823;
  --a-ui:#1F49C7;
  --focus:#1F49C7;
  --table-shadow:rgba(18,28,40,.38);
  /* fixed: physical objects that look the same in any room light */
  --housing:#0B1015;
  --housing-hi:rgba(255,255,255,.06);
  --housing-ink:#CBD4DC;
  --housing-dim:#6C7884;
  --housing-line:#222C36;
  --led-red:#FF4532;
  --led-blue:#4D86FF;
  --led-gold:#F2C14E;
  --led-off:#1A1E26;
  --led-red-glow:rgba(255,69,50,.5);
  --led-blue-glow:rgba(77,134,255,.5);
  --led-gold-glow:rgba(242,193,78,.42);
  --t-ink:#16202A;
  --t-red:#D63A25;
  --t-blue:#1F49C7;
  --t-gold:#C08A06;
  --banner-edge:rgba(255,255,255,.88);
  --tech-bg:rgba(11,16,21,.86);
  --tech-ink:#EEF3F7;
  --btn:#D63A25;
  --btn-edge:#962412;
  --btn-ink:#FFFFFF;
  --display:"Legend Myeongjo","AppleMyungjo","Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --room:#0D1318; --ink:#E3E9EE; --muted:#8C99A5; --card:#151E27; --well:#1C2731; --line:#2A3743;
    --scrim:rgba(13,19,24,.6); --gold:#F0C04A; --p-ui:#FF6A52; --a-ui:#7C9BFF; --focus:#8FB0FF;
    --table-shadow:rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --room:#0D1318; --ink:#E3E9EE; --muted:#8C99A5; --card:#151E27; --well:#1C2731; --line:#2A3743;
  --scrim:rgba(13,19,24,.6); --gold:#F0C04A; --p-ui:#FF6A52; --a-ui:#7C9BFF; --focus:#8FB0FF;
  --table-shadow:rgba(0,0,0,.7); color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;word-break:keep-all;background:var(--room);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.side{flex-direction:row}

/* score housing */
#board{flex:none;width:var(--tw,100%);max-width:100%;height:58px;display:grid;grid-template-columns:36px auto minmax(0,1fr) auto 36px;align-items:center;gap:10px;padding:0 10px;background:var(--housing);color:var(--housing-ink);border-radius:12px;box-shadow:inset 0 1px 0 var(--housing-hi),0 12px 24px -16px var(--table-shadow)}
#app.side #board{width:96px;height:var(--th,100%);grid-template-columns:1fr;grid-template-rows:36px auto minmax(0,1fr) auto 36px;justify-items:center;padding:10px 0;gap:12px}
.score{display:flex;flex-direction:column;align-items:center;gap:1px}
.score svg{height:32px;width:auto;display:block}
.score .lab{font-size:11px;font-weight:700;letter-spacing:.1em}
#sideP .lab{color:var(--led-red)}
#sideA .lab{color:var(--led-blue)}
#sideP .on{fill:var(--led-red)}
#sideA .on{fill:var(--led-blue)}
.off{fill:var(--led-off)}
#sideP svg{filter:drop-shadow(0 0 5px var(--led-red-glow))}
#sideA svg{filter:drop-shadow(0 0 5px var(--led-blue-glow))}
.bump svg{animation:bump .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(.85)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.mid{text-align:center;min-width:0;align-self:center}
#midName{font-family:var(--display);font-size:15px;line-height:1.1;letter-spacing:.02em;text-wrap:balance}
#midName.god{color:var(--led-gold)}
#midSub{font-size:11px;color:var(--housing-dim);margin-top:3px;letter-spacing:.04em;text-wrap:balance}
#app.side #midName{font-size:13px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--housing-line);background:transparent;color:var(--housing-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:disabled{opacity:.28;cursor:default}
.ib svg{width:18px;height:18px;fill:currentColor}

/* the table */
#stage{position:relative;flex:none;container-type:size;container-name:stage;touch-action:none;box-shadow:0 24px 44px -24px var(--table-shadow)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#stage.playing #cv{cursor:none}

#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-size:17cqmin;line-height:1;color:var(--t-ink);opacity:0;text-shadow:0 3px 0 var(--banner-edge),0 0 18px var(--banner-edge)}
#banner.p{color:var(--t-red)}
#banner.a{color:var(--t-blue)}
#banner.g{color:var(--t-gold)}
#banner.show{animation:pop 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(1.5)}14%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96)}}
@keyframes fade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* technique callout: names the move the AI just fired */
#tech{position:absolute;left:50%;top:0;pointer-events:none;padding:.45em .95em;border-radius:999px;background:var(--tech-bg);color:var(--tech-ink);font-family:var(--display);font-size:clamp(11px,3.8cqmin,18px);line-height:1.2;letter-spacing:.02em;white-space:nowrap;opacity:0}
#tech.god{color:var(--led-gold);box-shadow:0 0 0 1px var(--led-gold-glow),0 0 22px var(--led-gold-glow)}
#tech.show{animation:techIn 1.3s ease-out forwards}
@keyframes techIn{0%{opacity:0;translate:0 -10px}10%{opacity:1;translate:0 0}78%{opacity:1}100%{opacity:0}}

/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(10px,4cqmin,28px);background:var(--scrim);border-radius:inherit}
.card{width:min(100%,380px);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -18px var(--table-shadow);touch-action:pan-y}
.kicker{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.card h1,.card h2{margin:0;font-family:var(--display);font-weight:400;line-height:1;letter-spacing:.01em;text-wrap:balance}
.card h1{font-size:30px}
.card h2{font-size:26px}
.head{display:flex;flex-direction:column;gap:6px}
.orn{height:2px;width:72px;background:linear-gradient(90deg,var(--gold),transparent);margin:2px 0 2px}
.sub{margin:0;color:var(--muted);font-size:13px}

.levels{display:flex;flex-direction:column;gap:6px}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.lv:hover{background:var(--well)}
.lv[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--well)}
.lv[data-lv="god"][aria-checked="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.bars{display:grid;grid-template-columns:repeat(4,5px);align-items:end;gap:2px;height:20px}
.bars i{display:block;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:25%}.bars i:nth-child(2){height:50%}.bars i:nth-child(3){height:75%}.bars i:nth-child(4){height:100%}
.bars i.lit{background:var(--ink)}
.lv[data-lv="god"] .bars i.lit{background:var(--gold)}
.lv-text{display:flex;flex-direction:column;min-width:0}
.lv-name{font-family:var(--display);font-size:16px;line-height:1.15}
.lv[data-lv="god"] .lv-name{color:var(--gold)}
.lv-desc{font-size:12px;color:var(--muted);line-height:1.35}
.lv-rec{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.aside{display:flex;flex-direction:column;gap:12px}
.handi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:var(--well)}
.handi-text{display:flex;flex-direction:column;min-width:0}
.handi-title{font-weight:700;font-size:14px}
.handi-note{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;cursor:pointer;padding:0}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:2ch;text-align:center;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}

.go{height:50px;width:100%;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:19px;letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 0 var(--btn-edge);transition:transform .06s}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.ghost{height:46px;width:100%;border:1px solid var(--line);border-radius:10px;background:transparent;font-weight:700;cursor:pointer}
.ghost:hover{background:var(--well)}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.final{display:flex;align-items:baseline;justify-content:center;gap:14px;font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.final .fp{color:var(--p-ui)}
.final .fa{color:var(--a-ui)}
.final .colon{color:var(--muted);font-size:40px}
.final-labels{display:flex;justify-content:center;gap:58px;margin-top:-8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.res-line{margin:0;font-size:14px;text-wrap:balance;text-align:center}

.result{text-align:center}
.result .kicker{text-align:center}

@container stage (orientation: landscape) and (max-height: 620px){
  #menu{width:min(100%,680px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"head head" "levels aside";column-gap:18px;row-gap:12px;align-items:start}
  #menu .head{grid-area:head}
  #menu .levels{grid-area:levels}

}

  .lv{padding:6px 10px}
  .lv-name{font-size:14px}

  .go{height:44px}

}
/* the display face is a heavy myeongjo serif */
#banner,#tech,.lv-name,.go,#midName,.final,.stepper output,.card h1,.card h2{font-weight:800}

@media (prefers-reduced-motion: reduce){
  #banner.show{animation-name:fade}
  #tech.show{animation-name:fade}

}

<script>
/*CORE-START*/
const W=500,H=900,RAIL=16,CW=W+RAIL*2,CH=H+RAIL*2;
const PR=20,MR=34,R=PR+MR,GOAL=170,GX0=(W-GOAL)/2,GX1=(W+GOAL)/2,GC=W/2;
const FRICTION=.38,WALL_E=.88,MALLET_E=.9,MAX_PUCK=2600,PLAYER_MAX=5200,STEP=1/240,TARGET=7;
const DECAY=Math.exp(-FRICTION*STEP),GRIP=Math.exp(-11*STEP);
const POSTS=[[GX0,0],[GX1,0],[GX0,H],[GX1,H]];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;
const rot=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return [v[0]*c-v[1]*s,v[0]*s+v[1]*c]};
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return [x/l,y/l]};
const BANKS=['직선','뱅크','더블 뱅크','삼중 뱅크'];

/* Each level is a skill profile. Techniques: pin (wall trap + carom shot), feint, drift, orbit, volley.
   planner = shot search that simulates every angle and scores how hard each path is for the opponent to reach. */
const AI_CFG={
  easy:{maxSpeed:470,accel:2200,reaction:.26,predict:'none',track:.7,defY:70,homeY:82,shadow:.3,
    attackSpeed:220,attackIncoming:50,windup:16,strikeSpeed:760,strikeDist:26,follow:60,strikeTime:.36,recover:.6,
    jitter:30,lapse:.16,aim:'loose',aimError:.42,bank:0,maxPuck:2600},
  normal:{maxSpeed:900,accel:5000,reaction:.12,predict:'linear',track:.93,defY:80,homeY:94,shadow:.5,
    attackSpeed:560,attackIncoming:140,windup:40,strikeSpeed:1400,strikeDist:22,follow:80,strikeTime:.3,recover:.28,
    jitter:10,aim:'random',aimError:.17,bank:.15,maxPuck:2600,
    pin:.5,pinRange:200,pinVy:260,pinPress:220,hold:[.25,.7],pinShot:'벽 밀착 샷',
    catch:{p:.22,maxIn:850,y:150,k:[.15,.48]}},
  hard:{maxSpeed:1450,accel:9500,reaction:.07,predict:'full',track:1,defY:88,homeY:102,shadow:.72,
    attackSpeed:820,attackIncoming:260,windup:48,strikeSpeed:2100,strikeDist:18,follow:90,strikeTime:.26,recover:.14,
    aim:'corner',aimError:.05,bank:.35,maxPuck:2600,
    pin:.6,pinRange:130,pinPress:240,hold:[.12,.45],pinName:'벽 밀착 크로스',
    feint:.28,feintName:'페이크',drift:.22,driftName:'드리프트',driftPush:150,
    volley:{y:190,maxIn:1500,lead:.07,name:'카운터'},
    catch:{p:.42,maxIn:1400,y:185,k:[.36,.47],name:'트랩'},
    planner:{react:.2,speed:1700,bounces:2,step:.04}},
  god:{maxSpeed:3000,accel:26000,reaction:0,predict:'full',track:1,defY:92,homeY:112,shadow:.85,
    attackSpeed:1500,attackIncoming:150,windup:72,strikeSpeed:3000,strikeDist:14,follow:110,strikeTime:.22,recover:.05,
    aim:'corner',aimError:0,bank:.5,maxPuck:3000,
    pin:.65,pinRange:90,pinPress:300,hold:[.04,.3],pinName:'벽 타기 크로스',
    feint:.32,feintName:'잔상 페이크',drift:.28,driftName:'그림자 드리프트',driftPush:175,
    orbit:.4,orbitName:'궤도 선회',
    volley:{y:205,maxIn:6000,lead:.06,name:'순간 리다이렉트'},
    catch:{p:.5,maxIn:2700,y:230,k:[.42,.47],name:'무중력 트랩'},
    planner:{react:.12,speed:2300,bounces:3,step:.022},chaos:true}
};

const G={
  puck:{x:GC,y:H*.7,vx:0,vy:0,on:true},
  top:{side:'top',x:GC,y:84,vx:0,vy:0},
  bot:{side:'bottom',x:GC,y:H-84,vx:0,vy:0},
  ai:{top:null,bottom:null},
  pt:{x:GC,y:H-84},
  hist:[],t:0,acc:0,freeze:false,hold:false,stT:0,stB:0,
  fx:{hit(){},wall(){},goal(){},tech(){}}
};

function makeAI(side,lv){
  const c=AI_CFG[lv];
  return {side,lv,c,t:Math.random()*10,tx:GC,ty:side==='top'?84:H-84,maxV:c.maxSpeed,rush:false,
    strike:false,strikeT:0,sx:0,sy:0,cool:0,hit:false,hitNow:false,plan:null,lapse:0,n:0,nT:0,
    vshot:null,vT:0,dT:0,dOn:0,dx:0,dy:0,trap:null,inMode:null,absorb:0,rolled:false};
}
// Every AI thinks in local coordinates: its own goal at y=0, the opponent's goal at y=H.
const toL=(s,o)=>s==='top'?{x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0}:{x:o.x,y:H-o.y,vx:o.vx||0,vy:-(o.vy||0)};
const fromL=(s,y)=>s==='top'?y:H-y;

function perceive(d){
  const p=G.puck,h=G.hist;
  if(d<=0||!h.length) return p;
  const t=G.t-d;
  for(let i=h.length-1;i>=0;i--) if(h[i].t<=t) return h[i];
  return h[0];
}

// Puck flight ignoring mallets. With lineY: first crossing of that line while heading for y=0.
function predict(px,py,vx,vy,lineY,maxT){
  const dt=1/120,dec=Math.exp(-FRICTION*dt);let t=0;
  while(t<maxT){
    vx*=dec;vy*=dec;px+=vx*dt;py+=vy*dt;t+=dt;
    if(px<PR){px=2*PR-px;vx=-vx*WALL_E}else if(px>W-PR){px=2*(W-PR)-px;vx=-vx*WALL_E}
    if(!(px>GX0&&px<GX1)){if(py<PR){py=2*PR-py;vy=-vy*WALL_E}else if(py>H-PR){py=2*(H-PR)-py;vy=-vy*WALL_E}}
    if(lineY!=null){
      if(vy<0&&py<=lineY) return {x:px,y:py,vx,vy,t};
      if(vx*vx+vy*vy<400) return null;
    }
  }
  return lineY==null?{x:px,y:py,vx,vy,t}:null;
}

function segDist(p,a,b){
  const vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy||1;
  const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l2,0,1);
  return Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t);
}
const contactSpeed=c=>Math.min(c.strikeSpeed,Math.sqrt(2*c.accel*1.4*c.windup));

// Contact normal that sends a moving puck along (dx,dy) when the mallet meets it at speed s.
function solveNormal(v,s,dx,dy){
  const want=Math.atan2(dy,dx);let a=want;
  for(let i=0;i<6;i++){
    const nx=Math.cos(a),ny=Math.sin(a),vn=(v.x-s*nx)*nx+(v.y-s*ny)*ny;
    if(vn>=0) break;
    const ox=v.x-(1+MALLET_E)*vn*nx,oy=v.y-(1+MALLET_E)*vn*ny;
    const e=want-Math.atan2(oy,ox);a+=Math.atan2(Math.sin(e),Math.cos(e))*.9;
  }
  return [Math.cos(a),Math.sin(a)];
}

// Flies one candidate shot. Returns how far the opponent falls short of blocking it (margin), or null if it misses.
function simShot(px,py,vx,vy,O,Ov,pl){
  const dt=1/120,dec=Math.exp(-FRICTION*dt),zone=H/2-PR+4;let t=0,b=0,m=1e9;
  while(t<1.4){
    vx*=dec;vy*=dec;px+=vx*dt;py+=vy*dt;t+=dt;
    if(px<PR){px=2*PR-px;vx=-vx*WALL_E;if(++b>pl.bounces) return null}
    else if(px>W-PR){px=2*(W-PR)-px;vx=-vx*WALL_E;if(++b>pl.bounces) return null}
    if(py>=H-PR) return px>GX0+12&&px<GX1-12?{margin:m,t,b,ex:px}:null;
    if(py<PR||vy<=0) return null;
    if(py>zone){
      const k=Math.min(t,pl.react);
      const ox=clamp(O.x+Ov.x*k,MR,W-MR),oy=clamp(O.y+Ov.y*k,H/2+MR,H-MR);
      const g=Math.max(0,Math.hypot(px-ox,py-oy)-R*.95)-pl.speed*Math.max(0,t-pl.react);
      if(g<m) m=g;
    }
    if(vx*vx+vy*vy<90000) return null;
  }
  return null;
}
function bestShot(ai,Q,vin,wall,O,Ov){
  const c=ai.c,pl=c.planner,cs=contactSpeed(c),S=Math.min(c.maxPuck,(1+MALLET_E)*cs);
  let best=null;
  for(let a=-1.3;a<=1.3001;a+=pl.step){
    const dx=Math.sin(a),dy=Math.cos(a);
    let n,spd=S;
    if(wall){
      if(dx*wall>-.1) continue;
      n=norm(-dx/WALL_E,dy);spd=S*Math.hypot(WALL_E*n[0],n[1]);
    } else if(vin){
      n=solveNormal(vin,cs,dx,dy);
      const vn=(vin.x-cs*n[0])*n[0]+(vin.y-cs*n[1])*n[1];
      if(vn>=0) continue;
      spd=Math.min(c.maxPuck,Math.hypot(vin.x-(1+MALLET_E)*vn*n[0],vin.y-(1+MALLET_E)*vn*n[1]));
    } else n=[dx,dy];
    if(n[1]<.12) continue;
    const back=R+c.windup,ax=Q.x-n[0]*back,ay=Q.y-n[1]*back;
    if(ax<MR-2||ax>W-MR+2||ay<MR-2) continue;
    const r=simShot(Q.x,Q.y,dx*spd,dy*spd,O,Ov,pl);
    if(!r) continue;
    const sc=Math.min(r.margin,240)-r.t*80-r.b*5+Math.random()*10;
    if(!best||sc>best.score) best={n,b:r.b,margin:r.margin,ex:r.ex,score:sc};
  }
  return best;
}
function simpleShot(ai,Q,O,wall,vin){
  const c=ai.c,lo=GX0+PR+8,hi=GX1-PR-8;
  let gx,bank=0;
  if(wall) gx=wall<0?hi-Math.random()*45:lo+Math.random()*45;
  else if(c.aim==='loose') gx=GC+(Math.random()*2-1)*60;
  else if(c.aim==='random'){gx=lo+Math.random()*(hi-lo);if(chance(c.bank)) bank=chance(.5)?-1:1}
  else {gx=O.x<GC?hi:lo;if(chance(c.bank)) bank=chance(.5)?-1:1}
  const tx=bank<0?2*PR-gx:bank>0?2*(W-PR)-gx:gx;
  let d=norm(tx-Q.x,H+12-Q.y);
  if(c.aimError) d=rot(d,(Math.random()*2-1)*c.aimError);
  if(d[1]<.3) d=norm(d[0],.3);
  let n;
  if(wall){
    if(d[0]*wall>-.25) d=norm(-wall*.3,1);
    n=norm(-d[0]/WALL_E,d[1]);
  } else if(vin){n=solveNormal(vin,contactSpeed(c),d[0],d[1]);if(n[1]<.12) n=norm(n[0],.12)}
  else n=d;
  return {n,label:wall?(c.pinShot||null):(bank?'뱅크샷':null),margin:-1e9,score:-1e9};
}
function pickShot(ai,Q,M,O,wall,vin){
  const c=ai.c;
  if(c.planner){
    const Ov={x:O.vx,y:O.vy},b=bestShot(ai,Q,vin,wall,O,Ov);
    if(b){
      const n=c.aimError?rot(b.n,(Math.random()*2-1)*c.aimError):b.n;
      const mom=Math.abs(Ov.x)>380&&(b.ex-O.x)*Ov.x<0;
      const label=c.chaos?(b.b>0?BANKS[b.b]:mom?'역동작 저격':b.margin>80?'사각 저격':'직선 저격'):(b.b>0?BANKS[b.b]:null);
      return {n,label,margin:b.margin,score:b.score};
    }
  }
  return simpleShot(ai,Q,O,wall,vin);
}
function decoy(n,s){
  let d=rot(n,s*rnd(.7,1.2));
  if(d[1]<.25) d=rot(n,-s*rnd(.7,1.2));
  if(d[1]<.25) d=norm(d[0],.4);
  return d;
}
// Waypoint that walks around the puck instead of through it.
function route(M,Q,A,clear){
  if(segDist(Q,M,A)>=clear) return A;
  const am=Math.atan2(M.y-Q.y,M.x-Q.x),aa=Math.atan2(A.y-Q.y,A.x-Q.x);
  const diff=Math.atan2(Math.sin(aa-am),Math.cos(aa-am));
  const rr=Math.max(clear+12,Math.min(Math.hypot(M.x-Q.x,M.y-Q.y),clear+40));
  const step=s=>{const a=am+s*Math.min(Math.abs(diff)||1,.7);return {x:Q.x+Math.cos(a)*rr,y:Q.y+Math.sin(a)*rr}};
  const inb=p=>p.x>=MR&&p.x<=W-MR&&p.y>=MR&&p.y<=H/2-MR;
  const s=diff>=0?1:-1;let wp=step(s);
  if(!inb(wp)){const w2=step(-s);if(inb(w2)) wp=w2}

}
// Same, but also clears where a moving puck is about to be.
function routeSafe(M,P,A,clear){
  const qs=[{x:P.x,y:P.y}];
  if(Math.hypot(P.vx,P.vy)>60) for(const t of [.05,.1,.16]) qs.push(predict(P.x,P.y,P.vx,P.vy,null,t));
  let worst=null,wd=1e9;
  for(const q of qs){const d=segDist(q,M,A);if(d<clear&&d<wd){wd=d;worst=q}}
  return worst?route(M,worst,A,clear):A;
}
// "setup → shot"; a plain straight finish is implied after a named setup
const compose=(a,b)=>a?(b&&b!=='직선 저격'?a+' → '+b:a):b;
function fire(ai,Q,n,label,T){
  const c=ai.c;ai.strike=true;ai.strikeT=T||c.strikeTime;ai.sx=Q.x+n[0]*c.follow;ai.sy=Q.y+n[1]*c.follow;ai.plan=null;
  if(label) G.fx.tech(ai.side,label,ai.lv);
}
function approachAndFire(ai,Q,n,M,label,P){
  const c=ai.c,back=R+c.windup,ax=Q.x-n[0]*back,ay=Q.y-n[1]*back;
  const A={x:clamp(ax,MR,W-MR),y:clamp(ay,MR,H/2-MR)};
  if(Math.hypot(A.x-ax,A.y-ay)>8){
    // no room behind the puck: let a moving one come out on its own
    if(P&&Math.hypot(P.vx,P.vy)>150) return null;
    // a slow puck tucked against our end: dig it out sideways, away from the mouth
    if(Q.y<R+c.windup&&Q.x>80&&Q.x<W-80){
      const d=norm(Q.x<GC?-1:1,clamp((Q.y-MR-2)/R,0,.45)),b=R+18;
      const D={x:clamp(Q.x-d[0]*b,MR,W-MR),y:clamp(Q.y-d[1]*b,MR,H/2-MR)};
      if(Math.hypot(M.x-D.x,M.y-D.y)<c.strikeDist+4){fire(ai,Q,d,null,.25);return {x:ai.sx,y:ai.sy,maxV:Math.min(c.strikeSpeed,900),rush:true}}
      const wp=P?routeSafe(M,P,D,R+5):route(M,Q,D,R+5);return {x:wp.x,y:wp.y};
    }
    const ux=Q.x-A.x,uy=Q.y-A.y;
    if(uy/(Math.hypot(ux,uy)||1)<.2) return null;
  }
  // swing only from a settled stance: near the spot and not still sliding away from the puck
  if(Math.hypot(M.x-A.x,M.y-A.y)<c.strikeDist&&M.vx*n[0]+M.vy*n[1]>-120&&Math.hypot(M.vx,M.vy)<Math.max(450,c.maxSpeed*.35)){
    fire(ai,Q,n,label);return {x:ai.sx,y:ai.sy,maxV:c.strikeSpeed,rush:true};
  }
  const wp=P?routeSafe(M,P,A,R+5):route(M,Q,A,R+5);

}
function leadPos(ai,P,M,n){
  const c=ai.c;
  if(Math.hypot(P.vx,P.vy)<25) return {x:P.x,y:P.y};
  const back=R+c.windup,tw=Math.sqrt(2*c.windup/(c.accel*1.4));
  let Q={x:P.x,y:P.y};
  for(let i=0;i<2;i++){
    const t=Math.hypot(M.x-(Q.x-n[0]*back),M.y-(Q.y-n[1]*back))/c.maxSpeed*.8+tw;
    Q=predict(P.x,P.y,P.vx,P.vy,null,clamp(t,0,.6));
  }
  return Q;
}

const newPlan=(kind,extra)=>Object.assign({kind,phase:'init',t:0,pt:0},extra||{});
const setPhase=(pl,ph)=>{pl.phase=ph;pl.pt=0};
const PLANS={
  // Plain shot. Leads a moving puck.
  shot(ai,pl,P,Q,M,O,sp,dt){
    const c=ai.c;
    if(sp>40){
      if(!pl.shot||pl.re<=0){pl.shot=pickShot(ai,Q,M,O,0,{x:P.vx,y:P.vy});pl.re=c.chaos?.06:.15}
      pl.re-=dt;
      return approachAndFire(ai,leadPos(ai,P,M,pl.shot.n),pl.shot.n,M,compose(pl.name,pl.shot.label),P);
    }
    if(!pl.shot||(c.planner&&pl.re<=0&&Math.hypot(M.x-Q.x,M.y-Q.y)>R+c.windup+30)){pl.shot=pickShot(ai,Q,M,O,0);pl.re=c.chaos?.08:.25}
    pl.re-=dt;
    return approachAndFire(ai,Q,pl.shot.n,M,compose(pl.name,pl.shot.label),P);
  },
  // Trap the puck against the side wall, hold it dead, then hit it into the wall so it caroms cross-court.
  pin(ai,pl,P,Q,M,O,sp,dt){
    const c=ai.c,s=pl.wall,wx=s<0?PR:W-PR,gap=Math.abs(P.x-wx);
    if(gap>c.pinRange+40||P.y<90||P.y>H/2-15||Math.abs(P.vy)>320) return null;
    if(pl.phase==='init'){setPhase(pl,'stage');return 'again'}
    const ty=P.y+P.vy*.1;
    if(pl.phase==='stage'){
      const S={x:clamp(P.x-s*(R+22),MR,W-MR),y:clamp(ty,MR,H/2-MR)};
      if(Math.hypot(M.x-S.x,M.y-S.y)<16||pl.pt>1.2){setPhase(pl,'press');return 'again'}
      const wp=routeSafe(M,P,S,R+5);return {x:wp.x,y:wp.y};
    }
    if(pl.phase==='press'){
      if(Math.abs(M.y-P.y)>24) return {x:P.x-s*(R+16),y:ty};   // out of line with a sliding puck: line up again first
      const pinned=gap<3&&Math.hypot(M.x-P.x,M.y-P.y)<R+5&&sp<50;
      pl.hold=pinned?(pl.hold||0)+dt:0;
      if(pl.hold>=pl.holdT||pl.pt>1.8){pl.shot=pickShot(ai,{x:wx,y:P.y},M,O,s);setPhase(pl,'shoot');return 'again'}
      if(gap>5) return {x:P.x-s*(R-8),y:ty,maxV:c.pinPress};          // walk the puck over to the wall
      return {x:wx-s*(R+1),y:ty,maxV:c.pinPress,soft:true};          // cradle it there until it dies
    }
    if(gap>7){ai.plan=newPlan('shot',{name:c.pinName});return 'again'}
    return approachAndFire(ai,Q,pl.shot.n,M,compose(c.pinName,pl.shot.label),P);
  },
  // Circle the puck while re-reading the opponent, then snap behind it and fire.
  orbit(ai,pl,P,Q,M,O,sp,dt){
    const c=ai.c;
    if(sp>340) return null;
    if(pl.phase==='init'){pl.dir=chance(.5)?1:-1;pl.lead=rnd(.5,.72);pl.minT=rnd(.16,.32);pl.maxT=rnd(.5,1.25);pl.ev=0;pl.age=0;setPhase(pl,'spin')}
    if(pl.phase==='spin'){
      pl.ev-=dt;pl.age+=dt;
      if(pl.ev<=0){pl.ev=.05;const s=pickShot(ai,Q,M,O,0);if(!pl.best||s.score>pl.best.score||pl.age>.25){pl.best=s;pl.age=0}}
      if(chance(dt*1.4)) pl.dir*=-1;
      if(pl.t>pl.minT&&(pl.best.margin>70||pl.t>pl.maxT)){ai.plan=newPlan('shot',{name:c.orbitName,shot:pl.best});return 'again'}
      const a=Math.atan2(M.y-Q.y,M.x-Q.x)+pl.dir*pl.lead,rad=R+c.windup*.72+Math.sin(ai.t*11)*8;
      return {x:Q.x+Math.cos(a)*rad,y:Q.y+Math.sin(a)*rad,maxV:c.maxSpeed*.6};

  },
  // Lunge at the puck from decoy angles and stop short, then shoot from the real one.
  feint(ai,pl,P,Q,M,O,sp,dt){

    if(pl.phase==='decoy'){
      const n=pl.decoy,b=R+c.windup*.7,A={x:clamp(Q.x-n[0]*b,MR,W-MR),y:clamp(Q.y-n[1]*b,MR,H/2-MR)};

  },
  // Tap the puck sideways, shadow it, and fire from wherever the opening shows up.
  drift(ai,pl,P,Q,M,O,sp,dt){

    }

    }
    return {x:L.x-pl.sx*18,y:L.y-(R+c.windup*.8)};

function runPlan(ai,P,M,O,dt){
  const Q={x:P.x,y:P.y},sp=Math.hypot(P.vx,P.vy);
  ai.plan.t+=dt;ai.plan.pt+=dt;
  for(let k=0;k<4;k++){
    const pl=ai.plan;if(!pl) return null;
    const r=PLANS[pl.kind](ai,pl,P,Q,M,O,sp,dt);
    if(r!=='again') return r;
  }
  return null;
}
// Rolls for a technique once per possession, as soon as the puck is in a state where one is possible.
function techPlan(ai,P){
  const c=ai.c,sp=Math.hypot(P.vx,P.vy),pr=c.pinRange||0;
  const wall=P.x<PR+pr?-1:P.x>W-PR-pr?1:0;
  const opts=[];
  if(c.pin&&wall&&P.y>130&&P.y<H/2-40&&sp<320&&Math.abs(P.vy)<(c.pinVy||180)) opts.push([c.pin,()=>newPlan('pin',{wall,holdT:rnd(c.hold[0],c.hold[1])})]);
  if(c.orbit&&sp<300&&P.x>130&&P.x<W-130&&P.y>150&&P.y<H/2-110) opts.push([c.orbit,()=>newPlan('orbit')]);
  if(c.feint&&sp<(c.chaos?320:220)&&P.y>110) opts.push([c.feint,()=>newPlan('feint',{count:c.chaos?1+Math.floor(Math.random()*3):1})]);
  if(c.drift&&sp<(c.chaos?200:170)&&P.y>120&&P.y<H/2-60&&P.x>110&&P.x<W-110) opts.push([c.drift,()=>newPlan('drift')]);
  for(const [p,make] of opts) if(chance(p)) return {rolled:true,plan:make()};
  return {rolled:opts.length>0,plan:null};
}

function homeCmd(ai,P,O,dt){
  const c=ai.c;let x,y=c.homeY;
  if(c.chaos){
    // stand on the line between own goal and the puck, then refuse to stand still
    x=GC+(P.x-GC)*clamp(c.homeY/Math.max(P.y,c.homeY),0,1);
    const amp=P.y>H/2&&Math.hypot(O.x-P.x,O.y-P.y)<150?.35:1;
    ai.dT-=dt;
    if(ai.dT<=0){ai.dT=rnd(.22,.75);ai.dx=rnd(-85,85);ai.dy=rnd(-30,55);ai.dOn=rnd(.1,.22)}
    if(ai.dOn>0){ai.dOn-=dt;x+=ai.dx*amp;y+=ai.dy*amp}
    x+=(Math.sin(ai.t*12.5)*24+Math.sin(ai.t*31+1)*8)*amp;
    y+=Math.sin(ai.t*8.3)*12*amp;
    return {x:clamp(x,GX0-50,GX1+50),y};
  }
  x=GC+(P.x-GC)*c.shadow;
  return {x:clamp(x,GX0-40,GX1+40),y};
}
function defend(ai,P,dt){
  const c=ai.c;let x;
  if(P.y<c.defY+16){
    // puck is already inside our line: guard the mouth from the goal line, where it would cross
    x=P.x;
    if(c.predict!=='none'){const r=P.vy<0?predict(P.x,P.y,P.vx,P.vy,PR+8,.6):null;x=r?r.x:predict(P.x,P.y,P.vx,P.vy,null,.1).x}
    return [clamp(x,GX0-10,GX1+10),MR];
  }
  if(c.predict==='none') x=P.x;
  else if(c.predict==='linear'){const tt=clamp((P.y-c.defY)/Math.max(80,-P.vy),0,.4);x=clamp(P.x+P.vx*tt,PR,W-PR)}
  else{const r=predict(P.x,P.y,P.vx,P.vy,c.defY,2);x=r?r.x:P.x}
  x=GC+(x-GC)*c.track;
  if(c.jitter){ai.nT-=dt;if(ai.nT<=0){ai.n=(Math.random()*2-1)*c.jitter;ai.nT=.45}x+=ai.n}
  return [clamp(x,GX0-34,GX1+34),c.defY];
}
function linearTo(P,y){
  if(P.vy>=-1) return null;
  const t=(P.y-y)/(-P.vy);if(t<0||t>1.2) return null;
  let x=P.x+P.vx*t,vx=P.vx;
  if(x<PR){x=2*PR-x;vx=-vx}else if(x>W-PR){x=2*(W-PR)-x;vx=-vx}
  return {x,y,vx,vy:P.vy,t};
}
// Trap: stand on the puck's path and give way at about half its speed, so it dies on the mallet.
function catchCmd(ai,P,M){
  const c=ai.c,k=c.catch;
  if(P.y<k.y+20) return null;
  const r=c.predict==='full'?predict(P.x,P.y,P.vx,P.vy,k.y,1.5):linearTo(P,k.y);
  if(!r) return null;
  const sp=Math.hypot(r.vx,r.vy);if(sp<120) return null;
  const u=[r.vx/sp,r.vy/sp],C={x:r.x+u[0]*R,y:r.y+u[1]*R};
  if(C.x<MR||C.x>W-MR||C.y<MR+4) return null;
  const dC=Math.hypot(M.x-C.x,M.y-C.y);
  if(2*Math.sqrt(dC/c.accel)+.03>r.t) return null;
  if(!ai.absorb) ai.absorb=rnd(k.k[0],k.k[1]);
  const v=ai.absorb*sp;
  if(r.t<=v/(c.accel*1.4)+.025+c.reaction&&dC<30){
    ai.trap={T:r.t+.16,x:C.x+u[0]*300,y:C.y+u[1]*300,v};
    return {x:ai.trap.x,y:ai.trap.y,maxV:v,rush:true};
  }
  return {x:C.x,y:C.y};
}
// Incoming puck: trap it, hit it back on the volley, or block.
function incomingCmd(ai,P,M,O,dt){
  const c=ai.c,v=c.volley;
  if(!ai.inMode) ai.inMode=c.catch&&Math.hypot(P.vx,P.vy)<c.catch.maxIn&&chance(c.catch.p)?'catch':'hit';
  if(ai.inMode==='catch'&&ai.cool<=0){const cmd=catchCmd(ai,P,M);if(cmd) return cmd}
  if(v&&ai.cool<=0&&P.y>v.y+8&&Math.hypot(P.vx,P.vy)<v.maxIn){
    const r=predict(P.x,P.y,P.vx,P.vy,v.y,1.2);
    if(r){
      ai.vT-=dt;
      if(!ai.vshot||ai.vT<=0){ai.vshot=pickShot(ai,r,M,O,0,{x:r.vx,y:r.vy});ai.vT=c.chaos?.05:.12}
      const n=ai.vshot.n,b=R+c.windup*.6;
      const A={x:clamp(r.x-n[0]*b,MR,W-MR),y:clamp(r.y-n[1]*b,MR,H/2-MR)};
      const dA=Math.hypot(M.x-A.x,M.y-A.y);
      if(2*Math.sqrt(dA/c.accel)+.02<r.t){
        if(r.t<=v.lead&&dA<70){fire(ai,r,n,compose(v.name,ai.vshot.label),r.t+.12);ai.vshot=null;return {x:ai.sx,y:ai.sy,maxV:c.strikeSpeed,rush:true}}
        return {x:A.x,y:A.y};
      }
    }
  }
  ai.vshot=null;
  const d=defend(ai,P,dt),T={x:d[0],y:d[1]};
  // if touching the puck from where we stand would push it toward our own mouth, go around it instead
  const ux=P.x-M.x,uy=P.y-M.y;
  return uy/(Math.hypot(ux,uy)||1)<-.45&&P.x>GX0-40&&P.x<GX1+40?routeSafe(M,P,T,R+4):T;
}

function aiThink(ai,m,opp,dt){
  const c=ai.c,p=G.puck;ai.t+=dt;
  const P=toL(ai.side,perceive(c.reaction)),M=toL(ai.side,m),O=toL(ai.side,opp);
  ai.hitNow=ai.hit;ai.hit=false;
  if(ai.cool>0) ai.cool-=dt;
  let cmd=null;
  if(ai.strike){
    ai.strikeT-=dt;
    if(ai.strikeT<=0||ai.hitNow||!p.on||G.hold){ai.strike=false;ai.cool=c.recover}
    else cmd={x:ai.sx,y:ai.sy,maxV:c.strikeSpeed,rush:true};
  }
  if(!cmd&&ai.trap){
    ai.trap.T-=dt;
    if(ai.trap.T<=0||ai.hitNow||!p.on||G.hold){
      if(ai.hitNow&&c.catch.name&&Math.hypot(p.vx,p.vy)<450) G.fx.tech(ai.side,c.catch.name,ai.lv);
      ai.trap=null;ai.absorb=0;ai.inMode=null;
    } else cmd={x:ai.trap.x,y:ai.trap.y,maxV:ai.trap.v,rush:true};
  }
  if(!cmd&&(!p.on||G.hold)){ai.plan=null;ai.inMode=null;cmd=homeCmd(ai,P,O,dt)}
  if(!cmd&&ai.lapse>0){ai.lapse-=dt;cmd={x:M.x,y:M.y,maxV:60}}
  if(!cmd){
    if(c.lapse&&chance(c.lapse*dt)) ai.lapse=rnd(.3,.6);
    const sp=Math.hypot(P.vx,P.vy);
    const attackable=P.y<H/2+2&&ai.cool<=0&&sp<c.attackSpeed&&P.vy>-c.attackIncoming;
    if(attackable){
      if(!ai.rolled&&(!ai.plan||ai.plan.kind==='shot')){const r=techPlan(ai,P);if(r.rolled){ai.rolled=true;if(r.plan) ai.plan=r.plan}}
      if(!ai.plan||ai.plan.t>3.2) ai.plan=newPlan('shot');
      cmd=runPlan(ai,P,M,O,dt);
      if(!cmd&&!ai.strike){ai.plan=newPlan('shot');cmd=runPlan(ai,P,M,O,dt);if(!cmd) ai.plan=null}
    } else {ai.plan=null;ai.rolled=false}
    if(P.vy>=-40){ai.inMode=null;ai.absorb=0}
    if(!cmd) cmd=P.vy<-40?incomingCmd(ai,P,M,O,dt):homeCmd(ai,P,O,dt);
  }
  // a swing aims through the puck and may point past the walls; the mallet itself is clamped in steer()
  if(cmd.rush){ai.tx=cmd.x;ai.ty=fromL(ai.side,cmd.y)}
  else{ai.tx=clamp(cmd.x,MR,W-MR);ai.ty=fromL(ai.side,clamp(cmd.y,MR,H/2-MR))}
  ai.maxV=cmd.maxV||c.maxSpeed;ai.rush=!!cmd.rush;ai.soft=!!cmd.soft;
}

function clampM(m){
  m.x=clamp(m.x,MR,W-MR);
  m.y=m.side==='top'?clamp(m.y,MR,H/2-MR):clamp(m.y,H/2+MR,H-MR);
}
function steer(m,ai,dt){
  const c=ai.c,dx=ai.tx-m.x,dy=ai.ty-m.y,d=Math.hypot(dx,dy);
  const want=ai.rush?ai.maxV:ai.soft?Math.min(ai.maxV,d*5):Math.min(ai.maxV,Math.sqrt(2*c.accel*d)*.9);
  let wx=0,wy=0;if(d>.5){wx=dx/d*want;wy=dy/d*want}
  let ax=wx-m.vx,ay=wy-m.vy;const al=Math.hypot(ax,ay),am=c.accel*(ai.rush?1.4:1)*dt;
  if(al>am){ax*=am/al;ay*=am/al}
  m.vx+=ax;m.vy+=ay;
  const nx=m.x+m.vx*dt,ny=m.y+m.vy*dt;
  m.x=nx;m.y=ny;clampM(m);
  if(m.x!==nx) m.vx=0;
  if(m.y!==ny) m.vy=0;
}
function hitMallet(m){
  const p=G.puck,dx=p.x-m.x,dy=p.y-m.y,d2=dx*dx+dy*dy;
  if(d2>=R*R) return;
  const d=Math.sqrt(d2);let nx,ny;
  if(d<1e-4){nx=0;ny=m.side==='top'?1:-1}else{nx=dx/d;ny=dy/d}
  p.x=m.x+nx*R;p.y=m.y+ny*R;
  const rvx=p.vx-m.vx,rvy=p.vy-m.vy,vn=rvx*nx+rvy*ny;
  // a slow mallet pressing the puck into a wall traps it instead of squeezing it out like a seed
  const own=G.ai[m.side];
  if(vn<0&&!(own&&own.strike)&&m.vx*m.vx+m.vy*m.vy<160000&&rvx*rvx+rvy*rvy<810000){
    const mouth=p.x>GX0&&p.x<GX1;
    if((p.x<=PR+6&&nx<-.5)||(p.x>=W-PR-6&&nx>.5)){p.x=p.x<W/2?PR:W-PR;p.vx=0;p.vy=p.vy*.3+m.vy*.4;return}
    if(!mouth&&((p.y<=PR+6&&ny<-.5)||(p.y>=H-PR-6&&ny>.5))){p.y=p.y<H/2?PR:H-PR;p.vy=0;p.vx=p.vx*.3+m.vx*.4;return}
  }
  if(vn<0){
    const e=-vn>=700?MALLET_E:.3+.6*(-vn)/700;
    p.vx-=(1+e)*vn*nx;p.vy-=(1+e)*vn*ny;
    const ai=G.ai[m.side],cap=ai?ai.c.maxPuck:MAX_PUCK,s=Math.hypot(p.vx,p.vy);
    if(s>cap){p.vx*=cap/s;p.vy*=cap/s}
    if(ai) ai.hit=true;
    if(-vn>40) G.fx.hit(Math.min(1,-vn/2200),m.x+nx*MR,m.y+ny*MR,m.side);
  }
}
function walls(){
  const p=G.puck;let imp=0;
  if(p.x<PR){p.x=PR;if(p.vx<0){imp=-p.vx;p.vx=-p.vx*WALL_E}}
  else if(p.x>W-PR){p.x=W-PR;if(p.vx>0){imp=p.vx;p.vx=-p.vx*WALL_E}}
  if(!(p.x>GX0&&p.x<GX1)){
    if(p.y<PR){p.y=PR;if(p.vy<0){imp=Math.max(imp,-p.vy);p.vy=-p.vy*WALL_E}}
    else if(p.y>H-PR){p.y=H-PR;if(p.vy>0){imp=Math.max(imp,p.vy);p.vy=-p.vy*WALL_E}}
  }
  for(const [qx,qy] of POSTS){
    const dx=p.x-qx,dy=p.y-qy,d2=dx*dx+dy*dy;
    if(d2<PR*PR&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;p.x=qx+nx*PR;p.y=qy+ny*PR;
      const vn=p.vx*nx+p.vy*ny;
      if(vn<0){imp=Math.max(imp,-vn);p.vx-=(1+WALL_E)*vn*nx;p.vy-=(1+WALL_E)*vn*ny}
    }
  }
  if(imp>140) G.fx.wall(Math.min(1,imp/2200));
}
function unpin(m){
  const p=G.puck,dx=p.x-m.x,dy=p.y-m.y,d2=dx*dx+dy*dy;
  if(d2<R*R-.5){const d=Math.sqrt(d2)||1;m.x=p.x-dx/d*R;m.y=p.y-dy/d*R;clampM(m)}
}
// A mallet pressing a slow puck into a wall traps it (for the player too).
function grip(){
  const p=G.puck;if(p.vx*p.vx+p.vy*p.vy>90000) return;
  for(const m of [G.top,G.bot]){
    const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
    if(d>R+1.5) continue;
    const nx=dx/(d||1),ny=dy/(d||1);
    const side=(p.x<=PR+.8&&nx<-.55)||(p.x>=W-PR-.8&&nx>.55);
    const end=((p.y<=PR+.8&&ny<-.55)||(p.y>=H-PR-.8&&ny>.55))&&!(p.x>GX0&&p.x<GX1);
    if(side||end){p.vx*=GRIP;p.vy*=GRIP}
  }
}
function simStep(pdx,pdy){
  const dt=STEP;G.t+=dt;
  if(G.ai.bottom) steer(G.bot,G.ai.bottom,dt);
  else{const b=G.bot,ox=b.x,oy=b.y;b.x+=pdx;b.y+=pdy;clampM(b);b.vx=(b.x-ox)/dt;b.vy=(b.y-oy)/dt}
  if(G.ai.top) steer(G.top,G.ai.top,dt);
  const p=G.puck;if(!p.on) return;
  if(G.freeze){p.vx=p.vy=0;unpin(G.top);unpin(G.bot);return}
  p.vx*=DECAY;p.vy*=DECAY;p.x+=p.vx*dt;p.y+=p.vy*dt;
  hitMallet(G.top);hitMallet(G.bot);walls();unpin(G.top);unpin(G.bot);grip();
  if(Math.abs(p.vx)+Math.abs(p.vy)<4){p.vx=0;p.vy=0}
  if(p.x>GX0&&p.x<GX1){
    if(p.y<-PR*.5){p.on=false;G.fx.goal('bottom');return}
    if(p.y>H+PR*.5){p.on=false;G.fx.goal('top');return}
  }
  if(!(p.x>-60&&p.x<W+60&&p.y>-90&&p.y<H+90)||!isFinite(p.x+p.y+p.vx+p.vy)) resetPuck(p.y<H/2?'top':'bottom');
}
function resetPuck(side){
  const p=G.puck;p.x=GC;p.y=side==='bottom'?H*.7:H*.3;p.vx=p.vy=0;p.on=true;
  G.hist.length=0;G.stT=G.stB=0;
}
function resetMallets(){
  Object.assign(G.top,{x:GC,y:84,vx:0,vy:0});Object.assign(G.bot,{x:GC,y:H-84,vx:0,vy:0});
  G.pt.x=GC;G.pt.y=H-84;
  for(const k in G.ai){const a=G.ai[k];if(a){a.strike=false;a.plan=null;a.cool=0;a.vshot=null;a.trap=null;a.inMode=null;a.absorb=0}}
}
function worldUpdate(dt){
  if(G.ai.top) aiThink(G.ai.top,G.top,G.bot,dt);
  if(G.ai.bottom) aiThink(G.ai.bottom,G.bot,G.top,dt);
  G.acc+=dt;let n=Math.floor(G.acc/STEP);G.acc-=n*STEP;if(n>30){n=30;G.acc=0}
  let pdx=0,pdy=0;
  if(!G.ai.bottom&&n>0){
    const tx=clamp(G.pt.x,MR,W-MR),ty=clamp(G.pt.y,H/2+MR,H-MR);
    let dx=tx-G.bot.x,dy=ty-G.bot.y;const d=Math.hypot(dx,dy),mx=PLAYER_MAX*STEP*n;
    if(d>mx){dx*=mx/d;dy*=mx/d}
    pdx=dx/n;pdy=dy/n;
  }
  for(let i=0;i<n;i++) simStep(pdx,pdy);
  const p=G.puck;
  G.hist.push({t:G.t,x:p.x,y:p.y,vx:p.vx,vy:p.vy});if(G.hist.length>120) G.hist.shift();
  if(p.on&&!G.freeze&&Math.hypot(p.vx,p.vy)<45){
    if(p.y<H/2){G.stT+=dt;G.stB=0}else{G.stB+=dt;G.stT=0}
  } else {G.stT=G.stB=0}
  if(G.ai.top&&G.stT>5) resetPuck('bottom');
  else if(G.ai.bottom&&G.stB>5) resetPuck('top');
}
/*CORE-END*/

/* audio */
let actx=null,out=null,noise=null,lastHit=0,lastWall=0;
function initAudio(){
  if(actx){if(actx.state==='suspended') actx.resume().catch(()=>{});return}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;
    actx=new AC();out=actx.createGain();out.gain.value=.55;out.connect(actx.destination);
    const len=Math.floor(actx.sampleRate*.2);noise=actx.createBuffer(1,len,actx.sampleRate);
    const d=noise.getChannelData(0);for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }catch(e){actx=null}
}
const canPlay=()=>actx&&!muted&&mode!=='attract'&&actx.state==='running';
function env(g,t,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function burst(t,freq,q,peak,dur){
  const n=actx.createBufferSource();n.buffer=noise;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=actx.createGain();env(g,t,peak,dur);n.connect(f);f.connect(g);g.connect(out);n.start(t);n.stop(t+dur+.02);
}
function tone(freq,t,dur,type,peak){
  const o=actx.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);const g=actx.createGain();env(g,t,peak,dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);return o;
}
function sHit(k){
  if(!canPlay()) return;const t=actx.currentTime;if(t-lastHit<.03) return;lastHit=t;
  burst(t,1400+k*2400,3,.12+k*.5,.06);
  const o=tone(260+k*260,t,.09,'triangle',.1+k*.3);o.frequency.exponentialRampToValueAtTime(110,t+.08);
}
function sWall(k){if(!canPlay()) return;const t=actx.currentTime;if(t-lastWall<.04) return;lastWall=t;burst(t,800+k*600,2,.05+k*.25,.05)}
function sGoal(mine){
  if(!canPlay()) return;const t=actx.currentTime;
  if(mine) [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.16,'square',.07));
  else {const o=tone(196,t,.45,'sawtooth',.08);o.frequency.exponentialRampToValueAtTime(92,t+.45)}
}
let lastTech=0;
function sTech(god){
  if(!canPlay()) return;const t=actx.currentTime;if(t-lastTech<1.2) return;lastTech=t;
  if(god){tone(1568,t,.18,'sine',.06);tone(2093,t+.05,.22,'sine',.05)}
  else tone(1175,t,.12,'sine',.05);
}
function sBeep(hi){if(canPlay()) tone(hi?988:659,actx.currentTime,.12,'sine',.18)}
function sEnd(win){
  if(!actx||muted) return;const t=actx.currentTime;
  if(win) [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.09,.22,'square',.06));
  else [392,330,262,196].forEach((f,i)=>tone(f,t+i*.14,.26,'triangle',.12));
}

const DIG=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
function ledSVG(n){
  const tens=n>=10?Math.floor(n/10)%10:-1,ones=n>=0?n%10:-1;
  const dig=(d,ox)=>Object.keys(SEGS).map(k=>{const[x,y,w,h]=SEGS[k];return `<rect x="${x+ox}" y="${y}" width="${w}" height="${h}" rx="2" class="${d>=0&&DIG[d].includes(k)?'on':'off'}"/>`}).join('');
  return `<svg viewBox="0 0 78 56" aria-hidden="true"><g transform="translate(8 0) skewX(-7)">${dig(tens,0)}${dig(ones,36)}</g></svg>`;
}

  const aw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const fit=(w,h)=>{w=Math.max(w,60);h=Math.max(h,60);const p=Math.min(w/CW,h/CH),l=Math.min(w/CH,h/CW);return l>p*1.04?{s:l,land:true}:{s:p,land:false}};
  const A=fit(aw,ah-BOARD_H-GAP),B=fit(aw-BOARD_W-GAP,ah);
  const side=B.s>A.s*1.08,pick=side?B:A;
  land=pick.land;
  const tw=Math.floor((land?CH:CW)*pick.s),th=Math.floor((land?CW:CH)*pick.s);
  app.classList.toggle('side',side);
  app.style.setProperty('--tw',tw+'px');app.style.setProperty('--th',th+'px');
  stage.style.width=tw+'px';stage.style.height=th+'px';
  stage.style.borderRadius=Math.round(Math.min(tw,th)*.049)+'px';
  const t=$('tech');
  if(land){const s=tw/CH;t.style.left=(tw-(RAIL+14)*s)+'px';t.style.top=(th/2)+'px';t.style.transform='translate(-100%,-50%)'}
  else{const s=tw/CW;t.style.left=(tw/2)+'px';t.style.top=((RAIL+12)*s)+'px';t.style.transform='translate(-50%,0)'}
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(1,Math.round(tw*dpr));cv.height=Math.max(1,Math.round(th*dpr));
  scale=cv.width/(land?CH:CW);
  buildTable();draw();
}
function baseT(c){if(land) c.setTransform(0,scale,-scale,0,scale*CH,0);else c.setTransform(scale,0,0,scale,0,0)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function buildTable(){
  tc.width=cv.width;tc.height=cv.height;
  const g=tc.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,tc.width,tc.height);baseT(g);
  // rails
  rr(g,0,0,CW,CH,26);
  const rg=g.createLinearGradient(0,0,CW,CH);rg.addColorStop(0,'#27333F');rg.addColorStop(1,'#121A22');g.fillStyle=rg;g.fill();
  rr(g,1.5,1.5,CW-3,CH-3,25);g.strokeStyle='rgba(255,255,255,.09)';g.lineWidth=1.5;g.stroke();
  // side stripes on the end rails
  g.fillStyle='#2654D8';g.fillRect(RAIL+26,RAIL*.38,GX0-40,3);g.fillRect(RAIL+GX1+14,RAIL*.38,W-GX1-40,3);
  g.fillStyle='#E1432C';g.fillRect(RAIL+26,CH-RAIL*.38-3,GX0-40,3);g.fillRect(RAIL+GX1+14,CH-RAIL*.38-3,W-GX1-40,3);
  // corner bolts
  g.fillStyle='#3A4856';for(const[x,y] of [[13,13],[CW-13,13],[13,CH-13],[CW-13,CH-13]]){g.beginPath();g.arc(x,y,3,0,7);g.fill()}
  // goal slots
  for(const top of [true,false]){
    const y0=top?0:RAIL+H,y1=top?RAIL+1:CH;
    const sg=g.createLinearGradient(0,y0,0,y1);
    sg.addColorStop(0,top?'#020304':'#0B1117');sg.addColorStop(1,top?'#0B1117':'#020304');
    g.fillStyle=sg;g.fillRect(RAIL+GX0,top?y0:y0-1,GOAL,y1-y0+1);
    g.fillStyle=top?'#2654D8':'#E1432C';
    g.fillRect(RAIL+GX0-3,top?2:CH-RAIL+2,3,RAIL-4);g.fillRect(RAIL+GX1,top?2:CH-RAIL+2,3,RAIL-4);
  }
  // surface
  g.save();g.translate(RAIL,RAIL);
  rr(g,0,0,W,H,10);g.fillStyle='#ECF1F4';g.fill();g.clip();
  const lg=g.createRadialGradient(W/2,H/2,40,W/2,H/2,H*.72);lg.addColorStop(0,'rgba(255,255,255,.7)');lg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lg;g.fillRect(0,0,W,H);
  // air holes
  g.fillStyle='rgba(60,86,112,.24)';g.beginPath();
  const sp=20;let row=0;
  for(let y=sp/2;y<H;y+=sp,row++) for(let x=row%2?sp:sp/2;x<W;x+=sp){g.moveTo(x+1.2,y);g.arc(x,y,1.2,0,Math.PI*2)}
  g.fill();
  // markings
  g.fillStyle='#D8473A';g.fillRect(0,H/2-2,W,4);
  g.strokeStyle='#D8473A';g.lineWidth=3;g.beginPath();g.arc(GC,H/2,74,0,Math.PI*2);g.stroke();
  g.beginPath();g.arc(GC,H/2,6,0,Math.PI*2);g.fill();
  g.strokeStyle='#2F5FD0';g.lineWidth=3;
  g.beginPath();g.arc(GC,0,112,0,Math.PI);g.stroke();
  g.beginPath();g.arc(GC,H,112,Math.PI,Math.PI*2);g.stroke();
  g.lineWidth=2;g.setLineDash([6,8]);
  for(const y of [H*.25,H*.75]){g.beginPath();g.moveTo(14,y);g.lineTo(W-14,y);g.stroke()}
  g.setLineDash([]);
  // inner edge shade
  const shade=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const s=g.createLinearGradient(x0,y0,x1,y1);s.addColorStop(0,'rgba(10,20,32,.2)');s.addColorStop(1,'rgba(10,20,32,0)');g.fillStyle=s;g.fillRect(rx,ry,rw,rh)};
  shade(0,0,0,14,0,0,W,14);shade(0,H,0,H-14,0,H-14,W,14);shade(0,0,14,0,0,0,14,H);shade(W,0,W-14,0,W-14,0,14,H);
  g.restore();
}

const PAL={
  p:{base:'#E1432C',rim:'#A82B17',knob:'#F46A51',hi:'rgba(255,224,214,.85)',ring:'225,67,44'},
  a:{base:'#2654D8',rim:'#17389C',knob:'#4F7BF3',hi:'rgba(218,230,255,.85)',ring:'38,84,216'},
  g:{base:'#E2A51A',rim:'#946406',knob:'#F8D15C',hi:'rgba(255,248,214,.95)',ring:'226,165,26'}
};
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function drawMallet(m,pal,glow){
  ctx.fillStyle='rgba(12,22,34,.24)';circ(m.x+3,m.y+5,MR);ctx.fill();
  if(glow){ctx.save();ctx.shadowColor='rgba(255,190,40,.9)';ctx.shadowBlur=16*scale}
  ctx.fillStyle=pal.base;circ(m.x,m.y,MR);ctx.fill();
  if(glow) ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle=pal.rim;circ(m.x,m.y,MR-4);ctx.stroke();
  ctx.fillStyle=pal.rim;circ(m.x,m.y,MR*.56);ctx.fill();
  const gr=ctx.createRadialGradient(m.x-6,m.y-7,2,m.x,m.y,MR*.48);
  gr.addColorStop(0,pal.hi);gr.addColorStop(.38,pal.knob);gr.addColorStop(1,pal.base);
  ctx.fillStyle=gr;circ(m.x,m.y,MR*.46);ctx.fill();
}
function drawPuck(p){
  ctx.fillStyle='rgba(12,22,34,.28)';circ(p.x+2.5,p.y+4,PR);ctx.fill();
  ctx.fillStyle='#1B2127';circ(p.x,p.y,PR);ctx.fill();
  ctx.strokeStyle='#3C4650';ctx.lineWidth=2.5;circ(p.x,p.y,PR-4);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,PR-1.5,Math.PI*1.05,Math.PI*1.55);ctx.stroke();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(tc,0,0);
  baseT(ctx);ctx.translate(RAIL,RAIL);
  if(goalFlash){
    const k=1-goalFlash.t/.9,top=goalFlash.side==='top';
    const gr=ctx.createLinearGradient(0,top?0:H,0,top?160:H-160);
    gr.addColorStop(0,`rgba(${goalFlash.col},${.5*k})`);gr.addColorStop(1,`rgba(${goalFlash.col},0)`);
    ctx.fillStyle=gr;ctx.fillRect(GX0-40,top?0:H-160,GOAL+80,160);
  }
  const godOn=diff==='god'&&mode!=='attract';
  for(const r of rings){
    const f=r.t/r.life,col=r.side==='top'?(godOn?PAL.g.ring:PAL.a.ring):PAL.p.ring;
    ctx.strokeStyle=`rgba(${col},${(1-f)*.55})`;ctx.lineWidth=3*(1-f)+.5;
    circ(r.x,r.y,8+f*(22+r.k*30));ctx.stroke();
  }
  const p=G.puck;
  if(p.on){
    for(let i=0;i<trail.length;i++){const q=trail[i],f=(i+1)/trail.length;ctx.fillStyle=`rgba(27,33,39,${.2*f*q.a})`;circ(q.x,q.y,PR*(.55+.45*f));ctx.fill()}
    drawPuck(p);
  }
  if(godOn){for(let i=0;i<ghosts.length;i++){const q=ghosts[i];ctx.fillStyle=`rgba(226,165,26,${.05+.16*(i/ghosts.length)})`;circ(q.x,q.y,MR);ctx.fill()}}
  drawMallet(G.top,godOn?PAL.g:PAL.a,godOn);
  drawMallet(G.bot,PAL.p,false);
}

/* loop */
function tick(dt){
  if(mode==='paused'||mode==='over') return;
  if(mode==='countdown'){
    timer+=dt;const i=Math.floor(timer/.6);
    if(i!==cdIdx&&i<3){cdIdx=i;banner(String(3-i),'n',.58);sBeep(false)}
    if(timer>=1.8){mode='play';G.freeze=false;G.hold=false;banner('시작!','n',.6);sBeep(true)}
  } else if(mode==='goal'){
    timer+=dt;
    if(timer>1.15){
      if(scoreP>=TARGET||scoreA>=TARGET){endMatch();return}
      resetPuck(nextServe);mode='serve';timer=0;
    }
  } else if(mode==='serve'){
    timer+=dt;if(timer>.45){mode='play';G.hold=false}
  } else if(mode==='attract'&&attractWait>0){
    attractWait-=dt;if(attractWait<=0) resetPuck(nextServe);
  }
  worldUpdate(dt);
  for(const r of rings) r.t+=dt;
  while(rings.length&&rings[0].t>rings[0].life) rings.shift();
  if(goalFlash){goalFlash.t+=dt;if(goalFlash.t>.9) goalFlash=null}
  const p=G.puck,sp=Math.hypot(p.vx,p.vy);
  if(p.on&&sp>650){trail.push({x:p.x,y:p.y,a:Math.min(1,(sp-650)/1400)});if(trail.length>7) trail.shift()}
  else if(trail.length) trail.shift();
  if(diff==='god'&&mode!=='attract'){ghosts.push({x:G.top.x,y:G.top.y});if(ghosts.length>7) ghosts.shift()}
  else ghosts.length=0;
}
let last=0;
function loop(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0)) dt=0;if(dt>.05) dt=.05;
  tick(dt);draw();requestAnimationFrame(loop);
}

/* input */
function toLogical(e){
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  let X,Y;
  if(land){const s=r.width/CH;X=py/s;Y=CH-px/s}else{const s=r.width/CW;X=px/s;Y=py/s}
  return {x:X-RAIL,y:Y-RAIL};
}
const controlling=()=>!G.ai.bottom&&(mode==='play'||mode==='countdown'||mode==='goal'||mode==='serve');
function aimAt(e){const q=toLogical(e);G.pt.x=q.x;G.pt.y=q.y}

function boot(data){
  loadPrefs();
  if(data&&AI_CFG[data.diff]) diff=data.diff;
  if(data&&typeof data.handicap==='number') handicap=clamp(data.handicap,0,6);

  cv.addEventListener('pointerdown',e=>{
    if(!controlling()) return;
    activeId=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    aimAt(e);e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{if(controlling()&&(e.pointerType==='mouse'||e.pointerId===activeId)) aimAt(e)});
  const release=e=>{if(e.pointerId===activeId) activeId=null};
  cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
  cv.addEventListener('contextmenu',e=>e.preventDefault());

  document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.lv)));
  $('hMinus').addEventListener('click',()=>setHandi(handicap-1));
  $('hPlus').addEventListener('click',()=>setHandi(handicap+1));
  $('startBtn').addEventListener('click',startMatch);
  $('againBtn').addEventListener('click',startMatch);
  $('menuBtn').addEventListener('click',toMenu);
  $('resumeBtn').addEventListener('click',resume);
  $('quitBtn').addEventListener('click',toMenu);
  $('pauseBtn').addEventListener('click',()=>mode==='paused'?resume():pause());
  $('soundBtn').addEventListener('click',()=>{muted=!muted;if(!muted) initAudio();setSoundIcon();savePrefs()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(mode==='paused') resume();else pause()}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden) pause()});

  selectLevel(diff);setHandi(handicap);setSoundIcon();
  try{new ResizeObserver(()=>layout()).observe(app)}catch(e){window.addEventListener('resize',layout)}
  layout();

  if(data&&data.inMatch){
    scoreP=data.scoreP|0;scoreA=data.scoreA|0;matchHandi=data.matchHandi|0;
    G.ai.top=makeAI('top',diff);G.ai.bottom=null;resetMallets();resetPuck('bottom');
    G.freeze=false;G.hold=true;prevMode='serve';timer=0;mode='paused';
    $('pauseKicker').textContent=NAMES[diff]+(matchHandi?` · 선점 ${matchHandi}점`:'');
    $('pauseP').textContent=scoreP;$('pauseA').textContent=scoreA;
    showOnly('pauseOv');renderScore();setMid();updatePauseBtn();
  } else toMenu();

  requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop)});
}

window.claude?.hot?.snapshot?.(()=>({diff,handicap,inMatch:isMatch(),scoreP,scoreA,matchHandi}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body></html>
